
name: Bounty CI Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Python Tests (${{ matrix.branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        branch:
          - main
          - fix-344-api-storage
          - fix-345-risk-recalculation
          - fix-346-env-precedence

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run complete Python test suite
        run: python -m pytest -v

  frontend-tests:
    name: Frontend Tests (${{ matrix.branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        branch:
          - main
          - fix-344-api-storage
          - fix-345-risk-recalculation
          - fix-346-env-precedence

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Run regression tests
        if: steps.install.outcome == 'success' && !cancelled()
        run: |
          if [ -f tests/api-storage-regression.test.cjs ]; then
            node --test tests/api-storage-regression.test.cjs
          fi

          if [ -f tests/risk-tab-regression.test.cjs ]; then
            node --test tests/risk-tab-regression.test.cjs
          fi

      - name: TypeScript verification
        if: steps.install.outcome == 'success' && !cancelled()
        run: npx tsc --noEmit

      - name: ESLint verification
        if: steps.install.outcome == 'success' && !cancelled()
        run: npm run lint

      - name: Production build
        if: steps.install.outcome == 'success' && !cancelled()
        run: npm run build
